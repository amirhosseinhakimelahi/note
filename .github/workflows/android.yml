name: Build Daylight APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build web app
        working-directory: daylight-v2
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Add web app to Android package
        working-directory: daylight-v2
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/public
          cp -r dist android/app/src/main/assets/public

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: daylight-v2/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daylight-apk
          path: daylight-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
